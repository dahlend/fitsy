[build-system]
requires = ["maturin>=1.12"]
build-backend = "maturin"

[project]
name = "fitsy"
version = "0.3.0"
description = "Strictly-conformant FITS 4.0 reader and writer."
readme = "readme.md"
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = ["numpy>=1.23"]

[project.urls]
Homepage = "https://github.com/dahlend/fitsy"
Repository = "https://github.com/dahlend/fitsy"
Documentation = "https://dahlend.github.io/fitsy/"
Changelog = "https://github.com/dahlend/fitsy/blob/main/CHANGELOG.md"
Issues = "https://github.com/dahlend/fitsy/issues"

[project.optional-dependencies]
test = ["pytest>=7"]
docs = [
    "sphinx>=7",
    "furo",
    "sphinx-autodoc-typehints",
    "sphinx-copybutton",
    "myst-parser",
    "numpy>=1.23",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.maturin]
features = ["python"]
module-name = "fitsy.fitsy"
# Mixed layout: `python/fitsy/` is copied into the wheel and the
# compiled extension is placed inside it. This is what puts
# `__init__.pyi` and the PEP 561 `py.typed` marker *within* the
# installed package -- `include = [...]` cannot, because its paths are
# relative to the wheel root, so the stubs landed in a top-level
# `stubs/` directory that no type checker ever looks at.
python-source = "python"
# Symbols are stripped via `[profile.release] strip` in Cargo.toml, not
# here: maturin's own `strip` conflicts with the debuginfo flag that
# `maturin develop` passes, which breaks the documented dev workflow.
